name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: JMa9-Dev/platform/.github/workflows/dotnet-ci.yml@main

  publish:
    needs: ci
    uses: JMa9-Dev/platform/.github/workflows/dotnet-publish.yml@main
    with:
      project: src/HelloApp/HelloApp.csproj

  deploy-dev:
    needs: publish
    uses: JMa9-Dev/platform/.github/workflows/deploy-appservice.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev
      app-name: hello-app

  deploy-prod:
    needs: deploy-dev
    uses: JMa9-Dev/platform/.github/workflows/deploy-appservice.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod
      app-name: hello-app
